version: '3.8'

# ============================================================
# RetailIQ - Multi-Container Production Docker Compose
# ============================================================

services:
  # 1. MySQL Database Service
  db:
    image: mysql:8.0
    container_name: retailiq_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: retail_iq_db
    ports:
      - "3306:3306"
    volumes:
      # Auto-executes schema and dataset on first startup
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/sample_dataset.sql:/docker-entrypoint-initdb.d/02_dataset.sql:ro
      - mysql_data:/var/lib/mysql
    networks:
      - retailiq_net

  # 2. Python Machine Learning REST Microservice
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: retailiq_ml
    restart: always
    ports:
      - "5001:5001"
    depends_on:
      - db
    networks:
      - retailiq_net

  # 3. Java Web Application on Apache Tomcat
  web:
    build:
      context: ./java_backend
      dockerfile: Dockerfile
    container_name: retailiq_web
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
      - ml_service
    networks:
      - retailiq_net

volumes:
  mysql_data:

networks:
  retailiq_net:
    driver: bridge
